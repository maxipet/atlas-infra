services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    environment:
      JELLYFIN_PublishedServerUrl: https://media.max-petri.xyz
    volumes:
      - /srv/containers/jellyfin/config:/config
      - /srv/containers/jellyfin/cache:/cache
      - /srv/media:/media:ro
    # Matches the media group used by the Samba share.
    group_add:
      - "2000"
    ports:
      # Direct LAN access for TV clients without Tailscale. The NixOS firewall
      # restricts this port to the home network only.
      - "0.0.0.0:8096:8096"
    devices:
      - /dev/dri:/dev/dri
