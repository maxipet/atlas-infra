services:
  dockge:
    image: louislam/dockge:latest
    container_name: dockge
    restart: unless-stopped
    environment:
      DOCKGE_STACKS_DIR: /opt/stacks
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /srv/containers/dockge:/app/data
      - /etc/nixos/compose:/opt/stacks
    ports:
      - "127.0.0.1:5001:5001"
